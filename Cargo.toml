[package]
name = "idrive-core"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Independent IDrive Backup client written in Rust"
default-run = "idrive-rs"

[lib]
crate-type = ["rlib", "staticlib", "cdylib"]

[[bin]]
name = "idrive-rs"
path = "src/bin/idrive-rs.rs"
required-features = ["native"]

[[bin]]
name = "idrive-bench"
path = "src/bin/idrive-bench.rs"
required-features = ["benchmark"]

[features]
default = ["native"]
ffi = ["native"]
benchmark = ["native", "dep:sha2"]
native = ["dep:tokio", "dep:reqwest", "dep:quick-xml", "dep:tempfile"]

[dependencies]
aes = { version = "0.8.4", features = ["zeroize"] }
flate2 = "1.1"
base64 = "0.22.1"
md-5 = "0.10.6"
md4 = "0.10.2"
sha2 = { version = "0.10.9", optional = true }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
thiserror = "2.0.18"
zeroize = "1.8.2"
tokio = { version = "1.51.1", features = ["rt-multi-thread", "macros", "net", "io-util", "io-std", "time", "sync", "fs"], optional = true }
reqwest = { version = "0.12.28", default-features = false, features = ["rustls-tls"], optional = true }
tempfile = { version = "3.23", optional = true }
quick-xml = { version = "0.38.4", optional = true }

[profile.release]
lto = "thin"
codegen-units = 1

[workspace]
